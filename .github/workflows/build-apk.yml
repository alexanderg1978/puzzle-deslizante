name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Restaurar clave de firma
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compilar APK firmado
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: >
          flutter build apk --release
          --build-name=1.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - name: Compilar APK (PR, sin firma de release)
        if: github.event_name == 'pull_request'
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: puzzle-deslizante-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Cada push a main publica un preview que la app detecta con su botón
      # de actualizaciones.
      - name: Publicar preview
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk puzzle-deslizante.apk
          gh release create "$TAG" puzzle-deslizante.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Preview $TAG" \
            --notes "$COMMIT_MESSAGE"

      # Solo se conservan los 2 últimos previews y artefactos para ahorrar espacio.
      - name: Limpiar previews y artefactos antiguos
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[2:][].tagName' |
            while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[2:][].id' |
            while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"; done
